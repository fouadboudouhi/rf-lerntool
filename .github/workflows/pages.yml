# Veröffentlicht das Lerntool auf GitHub Pages.
#
# Der Weg über Actions (statt "Deploy from a branch") hat zwei Gründe:
#   1. configure-pages mit enablement: true schaltet Pages beim ersten Lauf
#      selbst ein - niemand muss in den Einstellungen klicken.
#   2. Beim Branch-Weg läuft Jekyll über das Repository, und Jekyll ignoriert
#      das Verzeichnis vendor/ standardmäßig. Genau dort liegen Pyodide und
#      Robot Framework - das Tool wäre tot. Hier wird nichts verarbeitet.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
